[project]
name = "preloot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Minh Kevin Lam", email = "minh.kevin.lam@volvo.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.5",
]

[project.scripts]
preloot = "preloot.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
