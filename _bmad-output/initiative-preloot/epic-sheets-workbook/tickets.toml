# tickets.toml — epic-sheets-workbook's stories, in build order.
# Code lives in C:/Repos/Gargul_Preloot/tools/google_apps_script; shared fixtures in its fixtures/ folder.

[[entry]]
id = 1
type = "story"
title = "Tracer: CLASP-bound script in a new workbook"
description = "Creates the new workbook with a CLASP-managed bound script, the Advanced Sheets service, the owner menu with one stub per action file (attendance.js, snapshot.js, ledger.js, tier.js), the shared lock and atomic batchUpdate helper, one browser test page per story, a .claspignore for tests and fixtures, the old onOpen retired, and the README setup steps."
verify = "The owner opens the workbook, runs the test menu action and sees one row written; a forced failure writes nothing; the browser test page passes."
covers = ["CAP-1"]
after = []
hitl = true
risk = "medium"
unknown = "Whether Node 22+ and clasp can be installed and logged in on the owner's PC."

[[entry]]
id = 2
type = "story"
title = "Workbook data model, roster lookup and roster copy"
description = "Adds the workbook layout set up and refreshed by one menu action (see the architecture's Workbook Layout): French readable headers with notes, Roster and Rerolls with class/dependent-spec/role dropdowns, WoW class colours and emoji roles/specs, the Présence grid, Raids, Awards blocks per raider, one Objets tab per role with Statut and Gain per spec, Config, safe migrations that never delete owner data, one exact-name roster lookup that rejects duplicates and replaces the case-insensitive and realm matching, owner-only editing, and the copied roster and Rerolls."
verify = "A raider account opens the workbook read-only; the copied Roster and Rerolls match the old workbook; a duplicate raiderKey is flagged."
covers = ["CAP-1", "CAP-5"]
after = [1]
hitl = true
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Score formulas and shared fixtures"
description = "Adds Roster formula columns per allocation-rules.md and AD-2: Tier Presence and Max (raids since Config's BiS reset date), Lifetime Presence and Max (all raids, archives included), BiS and Impact loot counts from the Awards blocks, BiS Ratio, and Impact (sans gain objet) (empty for tanks), at full precision with display rounding; and fixtures/scores.json with inputs and expected unrounded outputs, including near-tie, exact-tie, and item-gain cases (full Impact Score = Impact base × the item's gain for an IMPACT spec), which epic-raid-companion's Lua also runs."
verify = "Entering each fixture row in a test copy reproduces its expected values, the browser test checks a JS reference against the fixture, and a raider account sees the Roster values read-only."
covers = ["CAP-2", "CAP-3", "CAP-4", "CAP-5"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Warcraft Logs attendance import"
description = "Adds owner menu actions to store WCL credentials in User Properties and import a public report into a raid: reuses the attendance.js fetch, writes `1` in the raid's Présence row for more than 25% of distinct completed boss fights across merged reports with Rerolls alts to their main, lists the report code in the raid's Raids row so a repeated code is a no-op, never overwrites a `B`, and commits in one batch; removes Drive output, Script Properties, the attendance date cutoffs, and the local tools, and repairs the attendance test pages. Owner flow (2026-10-22): an End raid window takes exactly one WCL link (required) and the Gargul export; 4.4 builds the window, the attendance import, the Présence row with Date and Instance from the report, and ending the raid (Raid ouvert cleared, protections removed); the Gargul box must stay empty until 4.7."
verify = "Importing a public report credits the expected raiders, importing it again changes nothing, and the browser tests pass."
covers = ["CAP-2"]
after = [6]
hitl = true
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Raider-facing views"
description = "Adds the view-only Roster, Impact Items (tanks without a score, MT1 before MT2, exact ties shown as ties), and per-spec tabs with ratios, score breakdowns, BiS/alt-BiS/Impact status, and simulated gain."
verify = "A raider account sees the three tabs with current values and cannot edit them."
covers = ["CAP-5"]
after = [3]
hitl = true
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Raid lifecycle and pre-raid snapshot export"
description = "Adds opening a raid (raidId created once and reused; its Raids and Présence rows added; Config's Raid ouvert set), freezing score inputs while it is open, and the menu export of the Interchange v2 snapshot (raiders with classSpec, Tier and Lifetime Presence, counts, parse, BiS Ratio, Impact base; plus the Objets item table with Statut and Gain per spec), raw or Base64, and fixtures/snapshot-sample.json for epic-raid-companion. Owner flow (2026-10-22): Raid (ID) is auto-incremented with no owner input; opening adds only the Raids row (the Présence row, Date and Instance come from 4.4's WCL import after the raid); Base64 dialog only."
verify = "The exported snapshot validates against Interchange v2 and recomputes to the values shown in the workbook."
covers = ["CAP-7"]
after = [3]
hitl = false
risk = "medium"
unknown = "How frozen inputs are refused when the owner edits a cell directly: a warning-only protection, an onEdit revert, or checks at export and import."

[[entry]]
id = 7
type = "story"
title = "Post-raid Custom-export import"
description = "Parses the Gargul Custom export lines, ignores committed raidIds, validates per AD-6 (Config's single open raid, treatment, unique checksum, exact recipient, Rerolls alts rejected, OS forced to NONE), lists rejected lines with checksum, date, time and winner, appends each award into the winner's Awards block (Date, Objet name from the Objets tabs, Objet (ID), Traitement, Raid (ID)) and clears Config's Raid ouvert in one batch (an empty export closes a raid with no awards), and adds fixtures/custom-export-sample.txt; removes the RCLC import, loot coefficients, and Pattern/Design prefix detection. Closing the raid also removes the warning-only protections whose description starts with RAID_OPEN_PROTECTION_PREFIX (story 6). Owner flow (2026-10-22): the loot import plugs into story 4's End raid window and batch (Gargul box), alongside the WCL attendance."
verify = "Importing the sample updates loot counts for exactly the awarded raiders, and a malformed sample changes nothing and lists its rejected lines."
covers = ["CAP-3", "CAP-4", "CAP-7"]
after = [6]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "Tier management"
description = "Adds activating the next tier, which is also the BiS reset (owner decision 2026-10-22: no reset inside a tier): sets Config's Palier actif (ID) and Début fenêtre BiS, restarting Tier Presence and BiS loot counts, archives the active tier read-only with no restore while its raids still count toward Lifetime Presence, all in one atomic batch, with the Impact Item Count carryover choice and refusal while a raid is open."
verify = "On a workbook copy, the reset restarts Tier Presence and BiS counts while Lifetime Presence remains, the archived tier is read-only and still counted, and each action is refused while a raid is open."
covers = ["CAP-1", "CAP-8"]
after = [7]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Accept the real Gargul export"
description = "Imports epic-raid-companion's recorded real Custom export into the live workbook, fixes any parser gap, keeps that export as a fixture, and records that story 6's snapshot loaded in the companion."
verify = "The real raid's loot counts in the live workbook match its awards, and the snapshot load is recorded."
covers = ["CAP-7"]
after = [7, "epic-raid-companion"]
hitl = true
risk = "medium"
unknown = "What the real export contains that the hand-written sample did not."

