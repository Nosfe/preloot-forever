# tickets.toml — the initiative's epics, in build order.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "PreLoot runs from a portable folder"
covers = ["CAP-1", "CAP-9", "CAP-10"]

[[epic]]
id = 2
slug = "epic-contested-items"
title = "Officers see the contested BiS items for a phase"
covers = ["CAP-2", "CAP-3", "CAP-4", "CAP-8"]
after = [{ epic = 1, needs = "preloot.models (artifact base, Issue, Spec and Phase tables), preloot.io, cli writing settings.json, and the stage runner" }]

[[epic]]
id = 3
slug = "epic-sim-priority"
title = "Officers get a sim-backed priority for each contested item"
covers = ["CAP-5", "CAP-6", "CAP-7", "CAP-8", "CAP-9"]
after = [
  { epic = 1, needs = "wowsimcli.exe v0.0.145 bundled in the build" },
  { epic = 2, needs = "resolved_bis.json, contested.json, and the render stage with its report template" },
]
